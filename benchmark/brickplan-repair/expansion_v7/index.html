<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrickPlan · 扩充题库展示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17283a;font:15px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1440px;margin:auto;padding:26px}h1{font-size:29px;margin:0 0 8px}h2{margin:0;font-size:21px}.note{background:#fff1d8;padding:12px 16px;border-radius:10px;margin:16px 0}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.summary span{background:#fff;padding:10px 18px;border:1px solid #dce3eb;border-radius:10px}nav{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#f3f5f8ed;padding:12px 0;z-index:2}select,button{font:inherit;padding:7px 10px;border:1px solid #cbd5e1;border-radius:7px;background:white;color:#17283a}button{cursor:pointer}article{background:white;border:1px solid #dce3eb;border-radius:15px;margin:22px 0;padding:20px}.header{display:grid;grid-template-columns:210px 1fr;gap:22px}.header>img{width:210px;border-radius:10px;background:#f5f5f5}.meta{color:#50627a;margin:8px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.controls select{max-width:100%}.compare{width:100%;display:block;border:1px solid #e2e8f0;border-radius:10px;cursor:zoom-in}.labels{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-weight:650;margin:8px 0}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.timeline img{width:100%;cursor:zoom-in}.timeline p{margin:5px 0}.manual{display:flex;gap:16px;align-items:flex-start;margin-top:15px}.manual img{width:min(70%,760px);cursor:zoom-in}.badge{background:#eaf2ff;padding:2px 8px;border-radius:5px;display:inline-block;margin-right:7px}a{color:#195da9}details{margin-top:18px}summary{cursor:pointer;font-weight:650}dialog{max-width:98vw;max-height:96vh;border:0;border-radius:12px;padding:12px}dialog img{max-width:94vw;max-height:88vh;display:block}dialog button{float:right}.empty{padding:30px;background:white}@media(max-width:650px){main{padding:14px}.header{grid-template-columns:1fr}.header>img{width:180px}.manual{display:block}.manual img{width:100%}}
</style>
<style>nav select{max-width:100%}.meta{overflow-wrap:anywhere}</style>
<main><h1>BrickPlan：长流程、社区错误与多次干扰</h1>
<p>保留原题库，新增一组可以逐件操作的扩展条件。每次只装／拆一块，允许其他合法顺序。下面展示实际几何渲染和程序验证的参考路线。</p>
<div class="note"><strong>这是题目设计展示，含错误类别与参考信息，不作为模型输入。</strong> 图中参考事件、修复路线由程序执行；没有把它们当作 AI 或真人成绩。难度为暂定结构分组，图片仍待真人审核。</div>
<div class="summary" id="counts"></div>
<p><a href="human-error-research/README.zh-CN.md" target="_blank">30个社区／官方／研究来源</a> · <a href="README.zh-CN.md" target="_blank">本轮改动与边界</a> · <a href="MODEL-CASE-CATALOG.zh-CN.md" target="_blank">逐模型、逐题目 Markdown 清单</a></p>
<nav><select id="track"><option value="">全部部分</option></select><select id="family"><option value="">全部错误／正常条件</option></select><select id="events"><option value="">全部事件次数</option><option value="0">静态／正常</option><option value="1">一次干扰</option><option value="2">两次干扰</option><option value="3">三次干扰</option></select></nav>
<section id="models"></section></main>
<dialog id="zoom"><button>关闭</button><img alt="放大查看"></dialog>
<script src="gallery-data.js"></script><script>
const models=window.EXPANSION||[], $=id=>document.getElementById(id);
const names={'control':'正常对照','missing':'少一块','wrong-color':'颜色拿错','extra-layer':'局部多装一层／重复加件','offset':'偏移一颗凸点','rotated':'方向装反','wrong-part':'相似零件／厚度拿错','early-cover':'提前封住安装通路','buried-repair':'拆开上层返修','left-right-swap':'左右位置互换','repeat-omission':'重复组件少做一份','cascade-removal':'连带拆落多块'};
const tracks={'D-long':'从空底板长流程（可查说明）','M-expanded':'原社区物件：增加错误','M-long':'原社区物件：加长模块','M-new-source':'新来源社区模块'};
const name=f=>names[f]||(f.startsWith('multiple-')?'连续多次干扰：'+f.slice(9).split('then-').map(x=>names[x]||x).join(' → '):f);
for(const t of new Set(models.map(m=>m.track))){const o=document.createElement('option');o.value=t;o.textContent=tracks[t]||t;$('track').append(o)}
for(const f of new Set(models.flatMap(m=>m.cases.map(c=>c.family)))){const o=document.createElement('option');o.value=f;o.textContent=name(f);$('family').append(o)}
const count=models.reduce((n,m)=>n+m.cases.length,0), multi=models.flatMap(m=>m.cases).filter(c=>c.eventCount>=2).length;
$('counts').innerHTML=`<span>${models.length} 个分轨配置</span><span>${count} 条扩展条件</span><span>${multi} 条连续多次干扰</span><span>最长 ${Math.max(...models.map(m=>m.activeParts),0)} 块实际操作</span>`;
function image(record,alt,cls=''){const im=document.createElement('img');im.src=record.file;im.alt=alt;im.loading='lazy';im.className=cls;im.addEventListener('click',()=>{$('zoom').querySelector('img').src=im.src;$('zoom').showModal()});return im}
function render(){
 $('models').replaceChildren();let shown=0;
 for(const m of models){
  if($('track').value&&$('track').value!==m.track)continue;
  const cases=m.cases.filter(c=>(!$('family').value||c.family===$('family').value)&&(!$('events').value||c.eventCount===+$('events').value));
  if(!cases.length)continue;shown++;
  const card=document.createElement('article'),head=document.createElement('div');head.className='header';head.append(image(m.fullImage,m.title+'完整场景'));
  const text=document.createElement('div');text.innerHTML=`<h2></h2><div class="meta"></div><p>先看左侧当前状态，再对照右侧唯一目标。静态正常题两边相同，可以直接结束；动态题需要从起始状态继续拼。</p>`;
  text.querySelector('h2').textContent=m.title;text.querySelector('.meta').textContent=`${tracks[m.track]} · 正常拼装／模块全长 ${m.activeParts} 块 · ${cases.length} 条条件 · 来源 ${m.sourceSetId}`;head.append(text);card.append(head);
  const controls=document.createElement('div');controls.className='controls';const select=document.createElement('select'),view=document.createElement('select');
  for(const c of cases){const o=document.createElement('option');o.value=c.id;o.textContent=`${c.mode==='static'?'静态':'动态'} · ${name(c.family)} · ${c.eventCount} 次事件`;select.append(o)}
  for(const [key,label] of [['isometric','斜视'],['rear','背面'],['top','俯视']]){const o=document.createElement('option');o.value=key;o.textContent=label;view.append(o)}controls.append(select,view);card.append(controls);
  const content=document.createElement('div');card.append(content);
  function show(){const c=cases.find(c=>c.id===select.value);content.replaceChildren();const label=document.createElement('p');label.className='meta';label.textContent=`${c.id} · ${c.profile.structuralGroup}（暂定结构分组） · 参考修复最多 ${c.profile.witnessRepairMoves} 步 · ${c.profile.machineVisible===false?'有遮挡／低对比，单列诊断':'机器图像检查，待真人确认'}`;content.append(label);
   const scope=document.createElement('p');scope.className='note';scope.textContent=c.mode==='static'?`静态题：左图就是开始答题时的状态，右图是本题必须恢复到的阶段，共 ${c.profile.targetParts} 块。完整物件缩略图只帮助认物，不是本题目标。`:(c.eventCount?`动态题：正式运行从起始状态逐件拼到右图，共 ${m.activeParts} 块。这里为了展示错误，左图特意显示参考路线第一次干扰后的状态；下方按时间列出 ${c.eventCount} 次变化。`:`动态正常对照：左图是开始答题时的状态，逐件拼到右图；整个过程没有后台干扰，共需拼 ${m.activeParts} 块。`);content.append(scope);
   const labels=document.createElement('div');labels.className='labels';labels.innerHTML=c.mode==='dynamic'&&c.eventCount?'<span>第一次干扰后的状态（展示用）</span><span>本题唯一目标 TARGET</span>':'<span>开始答题时的当前状态</span><span>本题唯一目标 TARGET</span>';content.append(labels,image(c.images[view.value],c.id+'当前与目标','compare'));
   if(c.timeline.length){const title=document.createElement('h3');title.textContent='程序参考过程中的实际干扰（不是模型结果）';content.append(title);const grid=document.createElement('div');grid.className='timeline';for(const e of c.timeline){const box=document.createElement('div');box.append(image(e.image,'第'+e.event+'次事件'));const p=document.createElement('p');p.textContent=`第${e.event}次事件${e.atManipulation?'，第'+e.atManipulation+'次装拆后':''}；合法撤回该事件的参考操作 ${e.repairMoves} 步。`;box.append(p);grid.append(box)}content.append(grid)}
  }
  select.onchange=view.onchange=show;show();
  const details=document.createElement('details');details.innerHTML='<summary>查看参考说明书：每步只装一块，顺序可以改变</summary>';const manual=document.createElement('div');manual.className='manual';const step=document.createElement('select');for(let i=0;i<m.manual.length;i++){const o=document.createElement('option');o.value=i;o.textContent='第 '+(i+1)+' 步';step.append(o)}const pane=document.createElement('div');pane.append(image(m.manual[0],m.title+'参考第1步'));step.onchange=()=>{pane.replaceChildren(image(m.manual[+step.value],m.title+'参考第'+(+step.value+1)+'步'))};manual.append(step,pane);details.append(manual);card.append(details);$('models').append(card);
 }
 if(!shown)$('models').innerHTML='<div class="empty">没有符合当前筛选的条件。</div>';
}
$('zoom').querySelector('button').onclick=()=>$('zoom').close();for(const id of ['track','family','events'])$(id).onchange=render;render();
</script></html>
