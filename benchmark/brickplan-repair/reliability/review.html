<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Atlas · 独立检查</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f5f7f9;color:#203043;margin:0}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 12px}header,section{background:white;padding:18px;border-radius:12px;margin-bottom:16px}button,select{font:inherit;padding:9px 13px;border:1px solid #ccd5dd;border-radius:7px;background:white;cursor:pointer}button.primary{background:#167575;color:white;border:0}button:disabled{opacity:.5}nav,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}p{line-height:1.65}.muted{color:#52657a;font-size:14px}#images{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}figure{margin:0;text-align:center;background:#fff;border:1px solid #e4e9ef;border-radius:8px;overflow:hidden}figure img{width:100%;height:170px;object-fit:contain;cursor:zoom-in}figure:first-child:nth-last-child(-n+2) img,figure:first-child:nth-last-child(-n+2)~figure img{height:330px}figcaption{font-size:13px;padding:8px}#status{font-weight:600;color:#127c62}#error{color:#b13b36;white-space:pre-wrap}label.choice{padding:12px;background:#f1f5f8;border-radius:8px;cursor:pointer}#tools{display:none}dialog{max-width:95vw;border:none;border-radius:10px}dialog img{max-width:90vw;max-height:82vh}#progress{margin-left:auto}</style>
<main><header><h1>积木题目检查</h1><nav><label>审查者 <select id="person"><option>A</option><option>B</option><option>C</option></select></label><select id="role"><option value="gt">看图和参考答案</option><option value="blind">不看答案，独立操作</option><option value="physics">判断能否拆装</option></select><select id="task"></select><span id="progress" class="muted"></span></nav><p id="intro"></p><p id="title" style="font-weight:700"></p><p id="error"></p></header>
<section id="tools"><div class="row"><button data-view="0">看当前与目标</button><button data-view="90">转 90° 看</button><button data-view="top">从上面看</button><button id="finish">完成拼装</button></div><p class="muted">先看现场，再查看库存或零件位置；每次只装／拆一块，操作后需要自己重新看图。</p><div class="row"><label>库存第 <select id="inventory"></select> 页</label><button id="inventoryLook">看这一页</button><label>零件 <select id="part"></select></label><label>位置第 <select id="page"></select> 页</label><button id="inspect">看位置</button><select id="candidate"><option value="">先查看位置页</option></select><button id="attach">安装</button><button id="detach">拆下</button></div><p id="stock" class="muted"></p><details><summary>说明书、历史图和完整物件</summary><p class="row"><label>说明第 <select id="manualStep"></select> 步</label><button id="manualLook">看这一步</button><label>曾看过的第 <input id="recallStep" type="number" min="1" value="1" style="width:70px"> 次操作</label><button id="recallLook">重看当时图片</button><button id="wholeLook">看完整物件与目标</button></p></details><p id="feedback" class="muted"></p></section>
<section><p id="gtViews" class="row"><label>看图角度 <select id="gtView"><option value="isometric">斜看</option><option value="rear">背面</option><option value="top">俯视</option></select></label></p><div id="images"></div><p id="notice" class="muted"></p><a id="geometry" hidden>下载这一步的 LDraw 场景，供第三方软件检查</a></section><section><div id="choices" class="row"></div><div id="methodRow" hidden><p>判断依据 <select id="method"><option value="images">只看这些图片</option><option value="third-party-software">已用第三方软件复核</option><option value="physical-parts">已用实物复核</option></select></p></div><p class="row"><button id="submit" class="primary">提交本题</button><button id="next">下一题</button><span id="status"></span></p><p class="muted">每人、每题、每种检查分别保存。改选不会清掉其他题；无需输入文字。看过答案的人不能再把同题记为盲操作。</p></section></main><dialog id="zoom"><button onclick="document.querySelector('#zoom').close()">关闭</button><br><img></dialog>
<script>
const $=s=>document.querySelector(s),qs=new URLSearchParams(location.search);let current=null,busy=false,sequence=0;
$('#person').value=qs.get('person')||'A';$('#role').value=qs.get('role')||'gt';
const labels={gt:{correct:'答案和步骤没问题',problem:'答案／步骤有问题',unclear:'图看不清，无法判断'},blind:{independent:'我看懂并独立完成了',unclear:'输入或操作不清楚',unfinished:'看懂了，但暂未完成'},physics:{possible:'这样拆装可以',impossible:'这样拆装不行',unclear:'无法判断'}};
async function api(path,body){let r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
function lock(v){busy=v;document.querySelectorAll('nav select,#gtView,#next,#submit').forEach(e=>e.disabled=v)}
function id(){return {person:$('#person').value,role:$('#role').value,code:$('#task').value}}
function options(el,values,display){el.replaceChildren(...values.map(v=>{let o=document.createElement('option');o.value=v;o.textContent=display?display(v):v;return o}))}
function render(d){current=d;$('#geometry').hidden=!d.geometryDownload;if(d.geometryDownload)$('#geometry').href=d.geometryDownload.file;$('#gtViews').hidden=d.role!=='gt';$('#error').textContent='';$('#title').textContent=d.code+' · '+d.title;$('#tools').style.display=d.role==='blind'?'block':'none';$('#methodRow').hidden=d.role!=='physics';$('#intro').textContent=d.role==='gt'?'只看当前、目标和参考步骤，判断答案是否合理。':d.role==='blind'?'本页没有答案。你与模型使用同样的观察和拆装接口。':'判断指定单块是否能沿直线拆装。选择“无法判断”也可以。';$('#images').replaceChildren(...d.images.map(i=>{let f=document.createElement('figure'),im=document.createElement('img'),c=document.createElement('figcaption');im.src=i.url;im.onclick=()=>{$('#zoom img').src=i.url;$('#zoom').showModal()};c.textContent=i.role;f.append(im,c);return f}));$('#notice').textContent=d.referenceNotice||(d.images.length?'点击图片可以放大。':'先点击“看当前与目标”。');$('#choices').replaceChildren(...Object.entries(labels[d.role]).map(([v,t])=>{let l=document.createElement('label');l.className='choice';let r=document.createElement('input');r.type='radio';r.name='judgment';r.value=v;r.checked=d.answer?.choice===v;l.append(r,document.createTextNode(' '+t));return l}));$('#status').textContent=d.answer?'本题已提交，可修改后再提交':'';if(d.role==='physics')$('#method').value=d.answer?.method||'images';if(d.observation){let o=d.observation,old=$('#part').value;options($('#inventory'),Array.from({length:o.inventoryPages},(_,i)=>i+1));options($('#manualStep'),Array.from({length:o.manualSteps},(_,i)=>i+1));options($('#part'),o.actionHandles.map(h=>h.id));if(o.actionHandles.some(h=>h.id===old))$('#part').value=old;pages();let cat=d.images.find(i=>i.role==='candidate-catalog');if(cat){$('#part').value=cat.partId;pages();$('#page').value=cat.page;options($('#candidate'),cat.items.map(x=>x.candidate))}else options($('#candidate'),[''],()=> '先查看位置页');$('#feedback').textContent='已用 '+(o.decision-1)+' / '+o.decisionBudget+' 次操作；'+(o.lastToolResult?.code||'等待观察');$('#stock').textContent=(o.lastToolResult?.inventoryAvailability||[]).map(r=>r.partId+'：'+({installed:'已装上',available:'可用',unavailable:'不可用'}[r.status]||r.status)).join('；');$('#tools').querySelectorAll('button').forEach(b=>b.disabled=d.finished);$('#manualLook').disabled=d.finished||!o.manualSteps}}
function pages(){let h=current?.observation?.actionHandles.find(h=>h.id===$('#part').value);options($('#page'),Array.from({length:Math.ceil((h?.candidateCount||0)/12)},(_,i)=>i+1))}
async function open(){let n=++sequence;$('#error').textContent='';$('#status').textContent='加载中…';try{let d=await api('/api/open?'+new URLSearchParams({...id(),view:$('#gtView').value}));if(n===sequence)render(d)}catch(e){if(n===sequence){$('#error').textContent=e.message;$('#images').replaceChildren();$('#status').textContent='';current=null}}}
async function tasks(){let n=++sequence;let role=$('#role').value;let rows=await api('/api/tasks?role='+role);if(n!==sequence)return;options($('#task'),rows.map(r=>r.code),c=>c+' · '+rows.find(r=>r.code===c).title);$('#progress').textContent=rows.length+' 道待检查样本';await open()}
async function action(tool,args){if(busy||!current)return;lock(true);$('#error').textContent='';try{render(await api('/api/action',{...id(),action:{tool,args}}))}catch(e){$('#error').textContent=e.message}finally{lock(false)}}
$('#role').onchange=()=>tasks().catch(e=>$('#error').textContent=e.message);$('#person').onchange=open;$('#gtView').onchange=open;$('#task').onchange=open;$('#part').onchange=()=>{pages();options($('#candidate'),[''],()=> '先查看位置页')};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>action('observe',{view:b.dataset.view==='top'?'top':'angled',rotateDegrees:b.dataset.view==='90'?90:0,show:['current','target']}));$('#inventoryLook').onclick=()=>action('observe',{view:'angled',rotateDegrees:0,show:['inventory'],inventoryPage:+$('#inventory').value});$('#inspect').onclick=()=>action('inspect',{partId:$('#part').value,page:+$('#page').value});$('#attach').onclick=()=>action('attach',{partId:$('#part').value,candidate:$('#candidate').value});$('#detach').onclick=()=>action('detach',{partId:$('#part').value});$('#finish').onclick=()=>action('finish',{});$('#manualLook').onclick=()=>action('inspect',{manualStep:+$('#manualStep').value});$('#recallLook').onclick=()=>action('recall',{decision:+$('#recallStep').value});$('#wholeLook').onclick=()=>action('observe',{view:'angled',rotateDegrees:0,show:['current','target'],focus:'whole'});
$('#submit').onclick=async()=>{if(!current||busy)return;let c=$('input[name=judgment]:checked');if(!c){$('#error').textContent='请选择一个判断。';return}lock(true);try{let identity=id();await api('/api/submit',{...identity,version:current.version,choice:c.value,method:$('#method').value});$('#status').textContent='已保存 ✓'}catch(e){$('#error').textContent=e.message}finally{lock(false)}};$('#next').onclick=()=>{let e=$('#task');if(e.selectedIndex<e.options.length-1){e.selectedIndex++;open()}else $('#status').textContent='已经是最后一题'};
tasks().catch(e=>$('#error').textContent=e.message);
</script></html>
