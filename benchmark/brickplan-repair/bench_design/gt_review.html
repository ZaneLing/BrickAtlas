<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>看图检查 GT</title>
<style>
:root{font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;color:#20352f;background:#f5f7f6}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}header{border-bottom:1px solid #e1e8e4;background:#fff}.header{max-width:1336px;margin:auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:21px;margin:0}header p{font-size:14px;color:#6a7b73;margin:3px 0 0}.identity{white-space:nowrap;color:#60776b;font-size:14px}.wrap{max-width:1336px;padding:20px 28px 145px;margin:auto}button,select{border:1px solid #d4dfd9;background:white;border-radius:8px;padding:8px 14px}button:hover:not(:disabled){background:#edf5f0;border-color:#8ab49e}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}.nav{display:flex;align-items:center;gap:10px}select{max-width:min(440px,55vw)}.progress{color:#6b7d73;font-size:14px}h2{font-size:23px;margin:0 0 5px}.description{margin:0;color:#60756b;font-size:14px}.viewbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:18px 0 12px}.tabs{display:flex;gap:5px}.tabs button{padding:6px 15px;border-color:transparent;background:transparent;color:#6a7c72}.tabs .active{color:#205b42;background:#e6efe9;font-weight:600}.hint{font-size:13px;color:#839187}.scenes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.scene{margin:0;background:#fff;border:1px solid #dfe7e1;border-radius:12px;overflow:hidden}.scene figcaption{padding:12px 15px 5px;font-size:16px;font-weight:600}.scene img{width:100%;height:auto;aspect-ratio:4/3;display:block;cursor:zoom-in;object-fit:contain;background:#f6f6f6}.scene small{display:block;padding:0 15px 11px;font-size:12px;color:#7d8b82}.gt{border-color:#9bb8ab}.gt figcaption span{font-size:11px;color:#557564;background:#edf3ef;padding:2px 6px;border-radius:4px;margin-left:5px;font-weight:500}.steps-head{display:flex;align-items:center;justify-content:space-between;margin:23px 0 10px}.steps-head h3{margin:0;font-size:16px}.steps-head small{color:#7d8d82}.steps{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}.step{padding:0;flex:0 0 150px;text-align:left;border:1px solid #dfe6e1;border-radius:9px;overflow:hidden;scroll-snap-align:start}.step img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#f6f6f6}.step span{display:block;font-size:12px;padding:7px 9px;white-space:normal;min-height:49px}.step.incident{border-color:#dcb1a3;background:#fcf3f0}.one-line{font-size:13px;color:#7d8d83;margin:9px 0}.notice{border-radius:9px;padding:10px 14px;background:#fff0df;color:#8c571e;margin-top:14px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #dbe4de;z-index:5}.bottom-inner{max-width:1336px;margin:auto;padding:15px 28px;display:flex;align-items:center;gap:20px;justify-content:space-between}.choices{display:flex;gap:9px;flex-wrap:wrap}.choice{display:flex;align-items:center;gap:7px;padding:10px 16px;border:1px solid #d5e0d8;border-radius:9px;cursor:pointer;background:white}.choice:has(input:checked){border-color:#43866a;background:#e9f4ed}.choice input{accent-color:#276e50}.submit{background:#276e50;color:#fff;border-color:#276e50;font-weight:600;white-space:nowrap;padding:11px 20px}.submit:hover:not(:disabled){background:#205b42;color:white}.save{font-size:12px;color:#718579;margin-top:5px;min-height:19px}.status{text-align:right}.loading{padding:80px 0;text-align:center;color:#7d8f83}.hidden{display:none!important}.modal{position:fixed;inset:0;z-index:20;background:#20352ff0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:22px;gap:12px}.modal img{max-width:min(1100px,96vw);max-height:77vh;object-fit:contain;background:#f6f6f6;border-radius:8px}.modalbar{display:flex;align-items:center;gap:12px;color:white}.modal button{background:#fff}.modal .close{position:absolute;right:20px;top:15px}.manager table{border-collapse:collapse;width:100%;background:white}.manager td,.manager th{text-align:left;padding:11px 13px;border-bottom:1px solid #e1e8e4;font-size:14px}.manager .flag{color:#a54c32}.manager .good{color:#256b4b}.error{color:#a84e34}@media(max-width:760px){.header{padding:14px 16px}.wrap{padding:16px 16px 215px}.toolbar{gap:10px}.nav{gap:6px}button,select{padding:7px 10px}select{max-width:53vw}.viewbar{align-items:flex-start}.scenes{grid-template-columns:1fr 1fr;gap:9px}.scene.gt{grid-column:1/-1;grid-row:2}.scene.gt img{max-height:44vh}.scene figcaption{padding:10px 10px 4px;font-size:14px}.scene small{padding:0 10px 8px}.hint{display:none}.bottom-inner{padding:12px 16px;display:block}.choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.choice{padding:9px 7px;font-size:13px;gap:4px}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:9px}.save{text-align:left}.submit{padding:10px 15px}.modal{padding:10px}.modalbar{font-size:13px;gap:7px}.identity{font-size:12px}.steps-head small{font-size:11px}}
@media(max-width:760px){.nav{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto}.nav select{width:100%;max-width:100%;min-width:0}}
</style>
<header><div class="header"><div><h1>看图检查 GT</h1><p>不用拼积木。看图判断参考答案对不对，选一下就能提交。</p></div><span class="identity" id="identity"></span></div></header>
<main class="wrap" id="review">
<div class="toolbar"><div class="nav"><button id="previous">← 上一题</button><select id="question" aria-label="选择题目"></select><button id="next">下一题 →</button></div><span class="progress" id="progress"></span></div>
<div id="loading" class="loading">正在打开图片…</div>
<section id="content" class="hidden"><h2 id="title"></h2><p class="description" id="description"></p>
<div class="viewbar"><div class="tabs" id="views"><button data-view="isometric" class="active">整体</button><button data-view="rear">背面</button><button data-view="top">顶面</button></div><span class="hint">三张图的视角和大小一致 · 点击图片可放大</span></div>
<div class="scenes"><figure class="scene"><figcaption id="currentLabel">当前状态</figcaption><img id="current" alt="当前状态"><small>看哪里需要改</small></figure><figure class="scene gt"><figcaption id="resultLabel">GT修复后<span>参考答案</span></figcaption><img id="result" alt="GT修复后的状态"><small>判断这样修是否正确</small></figure><figure class="scene"><figcaption>本题目标</figcaption><img id="goal" alt="本题目标"><small>对照最终应达到的状态</small></figure></div>
<div class="steps-head"><h3>GT步骤 <small>点击可逐步放大看</small></h3><small>一种可行做法，顺序不必唯一</small></div><div id="steps" class="steps"></div><p class="one-line">青色轮廓只标出这一步动的积木；动态题的额外变化会单独标注。</p><div id="warning" class="notice hidden"></div>
</section></main>
<div class="bottom" id="bottom"><div class="bottom-inner"><div class="choices" id="choices"><label class="choice"><input type="radio" name="verdict" value="correct">GT正确</label><label class="choice"><input type="radio" name="verdict" value="problem">GT有问题</label><label class="choice"><input type="radio" name="verdict" value="unclear">看不清／无法判断</label></div><div class="status"><div class="save" id="save"></div><button class="submit" id="submit" disabled>提交并下一题 →</button></div></div></div>
<main id="manager" class="wrap manager hidden"></main>
<script>
const $=id=>document.getElementById(id),person=['A','B','C'].includes(location.pathname.slice(1))?location.pathname.slice(1):'A';
let tasks=[],state=null,code=null,view='isometric',navigation=0,pending=Promise.resolve(),submitting=false;
const labels={correct:'GT正确',problem:'GT有问题',unclear:'看不清／无法判断'};
$('identity').textContent='审查者 '+person;
async function api(path,data){const response=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),keepalive:path==='/api/gt-choice'}:{});const value=await response.json();if(!response.ok&&response.status!==409)throw Error(value.message||'保存失败，请重试');return value;}
function draftKey(s){return 'gt-review:'+person+':'+s.previewVersion+':'+s.code;}
function identity(){return {reviewer:person,role:'gt',code};}
function imageURL(which,step){return '/api/gt-image?code='+encodeURIComponent(code)+'&view='+view+'&which='+which+(step===undefined?'':'&step='+step)+'&v='+state.previewVersion.slice(0,12);}
function updateProgress(){$('progress').textContent=tasks.filter(t=>t.submitted).length+' / '+tasks.length+' 题已提交';}
function renderImages(){for(const kind of ['current','result','goal']){$(kind).src=imageURL(kind);$(kind).onclick=()=>openImage($(kind).src,$(kind).alt);}document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('steps').replaceChildren();for(const step of state.steps){const b=document.createElement('button');b.className='step '+(step.kind==='incident'?'incident':'');const im=document.createElement('img');im.src=imageURL('step',step.index);im.alt=step.label;im.loading='lazy';const caption=document.createElement('span');caption.textContent=(step.index?'':'起点 · ')+step.label;b.append(im,caption);b.onclick=()=>openStep(step.index);$('steps').append(b);}}
function renderChoice(){document.querySelectorAll('[name=verdict]').forEach(r=>{r.checked=r.value===state?.choice;r.disabled=!state||submitting;});$('submit').disabled=!state?.choice||submitting;$('submit').textContent=submitting?'正在提交…':'提交并下一题 →';}
function openImage(src,title){const m=document.createElement('div');m.className='modal';const im=document.createElement('img');im.src=src;im.alt=title;const bar=document.createElement('div');bar.className='modalbar';bar.textContent=title;const close=document.createElement('button');close.textContent='关闭 ×';close.className='close';close.onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove();};m.append(close,im,bar);document.body.append(m);}
function openStep(index){const m=document.createElement('div');m.className='modal';const im=document.createElement('img'),bar=document.createElement('div'),title=document.createElement('span'),prev=document.createElement('button'),next=document.createElement('button'),close=document.createElement('button');bar.className='modalbar';prev.textContent='← 上一步';next.textContent='下一步 →';close.textContent='关闭 ×';close.className='close';const draw=()=>{im.src=imageURL('step',index);title.textContent=(index+1)+' / '+state.steps.length+' · '+state.steps[index].label;prev.disabled=index===0;next.disabled=index===state.steps.length-1;};prev.onclick=()=>{index--;draw();};next.onclick=()=>{index++;draw();};close.onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove();};bar.append(prev,title,next);m.append(close,im,bar);document.body.append(m);draw();}
async function openTask(next){await pending.catch(()=>{});const token=++navigation;code=next;state=null;submitting=false;renderChoice();$('content').classList.add('hidden');$('loading').classList.remove('hidden');$('loading').textContent='正在打开图片…';$('save').textContent='';$('question').value=code;const position=tasks.findIndex(t=>t.code===code);$('previous').disabled=position===0;$('next').disabled=position===tasks.length-1;history.replaceState(null,'','/'+person+'?task='+code);try{const value=await api('/api/open',identity());if(token!==navigation)return;state=value;view='isometric';$('title').textContent=code+' · '+state.title;$('description').textContent=state.description;$('resultLabel').firstChild.nodeValue=state.mode==='dynamic'&&!state.hasIncident?'GT完成后':'GT修复后';$('currentLabel').textContent=state.hasIncident?'出现问题后':'当前状态';$('warning').classList.toggle('hidden',!!state.replaySuccess);$('warning').textContent=state.failure||'这份参考过程没有完整通过回放，需要复查。';$('loading').classList.add('hidden');$('content').classList.remove('hidden');renderImages();renderChoice();$('save').textContent=state.submitted?'本题已提交：'+labels[state.choice]:(state.choice?'上次选择已恢复，可直接提交。':'');let local=null;try{local=JSON.parse(localStorage.getItem(draftKey(state)));}catch{}if(local&&local.answerRevision>state.answerRevision&&labels[local.choice])saveChoice(local.choice,local.answerRevision);}catch(e){if(token===navigation){$('loading').textContent='打开遇到问题：'+e.message;$('loading').classList.add('error');}}}
function saveChoice(choice,revision){if(!state||submitting)return;const id=identity(),token=navigation;state.choice=choice;state.submitted=false;state.answerRevision=revision||state.answerRevision+1;const body={...id,choice,answerRevision:state.answerRevision,previewVersion:state.previewVersion};localStorage.setItem(draftKey(state),JSON.stringify(body));renderChoice();$('save').textContent='正在保存选择…';pending=api('/api/gt-choice',body).then(result=>{if(token!==navigation||body.answerRevision!==state?.answerRevision)return;state.answerRevision=Math.max(state.answerRevision,result.answerRevision);$('save').textContent='选择已保存，点右侧提交即可。';}).catch(e=>{if(token===navigation)$('save').textContent='保存失败：'+e.message;throw e;});pending.catch(()=>{});}
document.querySelectorAll('[name=verdict]').forEach(r=>r.onchange=()=>saveChoice(r.value));
$('submit').onclick=async()=>{if(!state?.choice||submitting)return;submitting=true;renderChoice();const token=navigation;try{await pending;const body={...identity(),choice:state.choice,answerRevision:++state.answerRevision,previewVersion:state.previewVersion};const result=await api('/api/gt-submit',body);if(token!==navigation)return;if(!result.submitted)throw Error('进度已更新，请再点一次提交');state.submitted=true;state.answerRevision=result.answerRevision;localStorage.removeItem(draftKey(state));const item=tasks.find(t=>t.code===code);item.submitted=true;updateProgress();const pos=tasks.indexOf(item);if(pos+1<tasks.length){await openTask(tasks[pos+1].code);scrollTo(0,0);}else{$('save').textContent='本题已提交；可用上方菜单回看。';submitting=false;renderChoice();}}catch(e){if(token===navigation){submitting=false;renderChoice();$('save').textContent=e.message;}}};
$('question').onchange=()=>openTask($('question').value);$('previous').onclick=()=>{const i=tasks.findIndex(t=>t.code===code);if(i>0)openTask(tasks[i-1].code);};$('next').onclick=()=>{const i=tasks.findIndex(t=>t.code===code);if(i+1<tasks.length)openTask(tasks[i+1].code);};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(state){view=b.dataset.view;renderImages();}});
async function showManager(key){$('review').classList.add('hidden');$('bottom').classList.add('hidden');$('manager').classList.remove('hidden');const data=(await api('/api/summary?key='+encodeURIComponent(key))).gtInspection,m=$('manager');m.replaceChildren();const title=document.createElement('h2');title.textContent='GT检查结果';const p=document.createElement('p');p.textContent='已收到 '+data.submitted+' 份提交。'+data.note;const refresh=document.createElement('button');refresh.textContent='刷新提交';refresh.onclick=()=>showManager(key);const table=document.createElement('table'),header=document.createElement('tr');for(const text of ['题目','认为正确','有问题','看不清','当前判断']){const th=document.createElement('th');th.textContent=text;header.append(th);}table.append(header);for(const row of data.rows){const tr=document.createElement('tr');if(row.counts.problem||row.counts.unclear)tr.className='flag';for(const text of [row.code+' · '+row.title,row.counts.correct||0,row.counts.problem||0,row.counts.unclear||0,row.status]){const td=document.createElement('td');td.textContent=text;tr.append(td);}table.append(tr);}m.append(title,p,refresh,table);}
const managerKey=new URLSearchParams(location.search).get('manager');if(managerKey)showManager(managerKey).catch(e=>$('manager').textContent=e.message);else api('/api/tasks?reviewer='+person+'&role=gt').then(data=>{tasks=data.tasks;for(const t of tasks){const o=document.createElement('option');o.value=t.code;o.textContent=t.code+' · '+t.title;$('question').append(o);}updateProgress();const requested=new URLSearchParams(location.search).get('task');openTask(tasks.some(t=>t.code===requested)?requested:tasks.find(t=>!t.submitted)?.code||tasks[0].code);}).catch(e=>$('loading').textContent=e.message);
</script></html>
