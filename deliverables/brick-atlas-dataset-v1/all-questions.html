<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部题目记录</title>
<style>body{max-width:1400px;margin:30px auto;padding:0 20px;font:15px/1.6 system-ui;color:#172b35;background:#f6f8fa}a{color:#067b80}input,select,button{font:inherit;padding:8px;margin:5px;border:1px solid #cbd4db;border-radius:6px;background:white}input{min-width:300px}table{width:100%;border-collapse:collapse;background:white}td,th{padding:10px;text-align:left;border-bottom:1px solid #e1e7ec}td:first-child{font-size:12px;overflow-wrap:anywhere}small{color:#60717b}.note{background:#fff4d7;padding:12px;border-radius:8px}</style>
<h1>全部题目记录</h1><p><a href="index.html">当前可运行题库与图片</a> · <a href="COUNT-CHANGES.zh-CN.md">为什么题量变了</a> · <a href="all-questions.jsonl">下载完整记录</a></p>
<p class="note">这里保留历史题目的去向。只有“当前程序通过”的题目计入当前已检查题库；其他记录保留检索入口和原文件位置，不等于已重新验证。旧文件没有因为精选展示而删除。</p>
<p id="counts"></p><input id="search" placeholder="搜索题目 ID、物件名、错误"><select id="mode"><option value="">静态和动态</option><option value="static">静态</option><option value="dynamic">动态</option></select><select id="status"><option value="">所有状态</option></select><p id="found"></p>
<table><thead><tr><th>题目 ID</th><th>物件</th><th>题型／错误</th><th>状态</th><th>查看</th></tr></thead><tbody id="rows"></tbody></table><p><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></p>
<script src="all-questions.js"></script><script>
const D=window.ALL_QUESTIONS,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=0,total=0;const names={'current-machine-checked':'当前程序通过','historical-not-rechecked-in-this-round':'历史：本轮未复查','historical-pending-review':'历史：待审查','retired-source-or-human-selection':'已停用','withheld-reference-check':'参考回放未通过'};
for(const k of Object.keys(D.report.recordStatuses))$('status').add(new Option(names[k],k));$('counts').textContent=`当前已检查：${D.report.current.total} 题（静态 ${D.report.current.static}、动态 ${D.report.current.dynamic}）。完整记录目录：${D.questions.length} 条。`;
function show(){const text=$('search').value.toLowerCase(),rs=D.questions.filter(r=>(!$('mode').value||r.mode===$('mode').value)&&(!$('status').value||r.status===$('status').value)&&[r.id,r.title,r.family,r.familyZh].join(' ').toLowerCase().includes(text));total=rs.length;page=Math.min(page,Math.max(0,Math.ceil(total/60)-1));$('found').textContent=`找到 ${total} 条记录`;$('rows').innerHTML=rs.slice(page*60,page*60+60).map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.title)}</td><td>${r.mode==='static'?'静态':'动态'} · ${esc(r.familyZh||r.family)}</td><td>${esc(names[r.status])}${r.reason?'<br><small>'+esc(r.reason)+'</small>':''}</td><td>${r.core?`<a href="index.html?question=${encodeURIComponent(r.id)}#${encodeURIComponent(r.model)}">图片和 GT</a>`:`<small>${esc(r.sourceRecord)}</small>`}</td></tr>`).join('');$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(total/60))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*60>=total;}
for(const id of ['search','mode','status'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;show()});$('prev').onclick=()=>{page--;show()};$('next').onclick=()=>{page++;show()};show();
</script></html>
