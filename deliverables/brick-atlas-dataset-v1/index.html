<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Atlas · 数据集检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18232f;font:15px/1.6 system-ui,sans-serif}header{padding:24px 32px;background:white;border-bottom:1px solid #dce2e9}h1{font-size:24px;margin:0}p{margin:8px 0}.muted{color:#617080;font-size:13px}.stats{display:flex;gap:28px;flex-wrap:wrap}.stats strong{font-size:25px;color:#176d75}.layout{display:grid;grid-template-columns:310px 1fr;max-width:1600px;margin:auto}aside{padding:20px;border-right:1px solid #dce2e9}input,select,button{font:inherit;border:1px solid #c7d0d9;background:white;border-radius:7px;padding:8px}input,aside select{width:100%;margin-bottom:10px}button{cursor:pointer}button:hover,button.active{border-color:#008b95;background:#e6f7f6}.model{width:100%;text-align:left;margin:4px 0;font-size:13px;line-height:1.4}.model span{display:block;color:#637184;margin-top:4px}#list{max-height:76vh;overflow:auto}main{padding:24px;min-width:0}h2{margin:0 0 8px;font-size:22px}h3{font-size:16px;margin:20px 0 10px}.panel{background:white;border:1px solid #dde3ea;border-radius:12px;padding:18px;margin-bottom:18px}.context{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}.context img{width:100%;height:170px;object-fit:contain}.views{display:flex;gap:6px;margin-bottom:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}figure img{width:100%;background:#fafafa;border:1px solid #e1e6eb;border-radius:8px}figcaption{font-size:13px;font-weight:600;margin:6px 0}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #e1e6eb}tr.selected{background:#e6f7f6}tbody tr{cursor:pointer}td code{font-size:11px;word-break:break-all}.tag{display:inline-block;background:#eef2f6;border-radius:5px;padding:2px 6px;margin-right:5px;font-size:12px}pre{max-height:350px;overflow:auto;background:#f4f6f8;padding:12px;font-size:12px}.warn{background:#fff6df;padding:10px;border-radius:8px}a{color:#176d75}@media(max-width:900px){.layout{grid-template-columns:1fr}#list{max-height:230px}.context{grid-template-columns:130px 1fr}header,main,aside{padding:16px}.pair{gap:6px}}
</style>
<header><h1>Brick Atlas · 模型与题目</h1><p>先看完整物件，再看本题要完成的位置。点击题目可以查看错误展示和参考修复。</p><div class="stats" id="stats"></div><p class="muted">所有数字实时来自这次导出的清单。程序通过 ≠ 真人认可；原始来源数量 ≠ 可运行模型数量。这里是研究者查看答案的页面，模型运行时不会收到隐藏事件或 GT。</p></header>
<div class="layout"><aside><input id="search" placeholder="搜索物件名、套装编号"><select id="level"><option value="">全部长度</option><option value="short">短：3–7 件</option><option value="medium">中：8–15 件</option><option value="long">长：16 件及以上</option></select><select id="category"><option value="">全部物件类别</option></select><p class="muted" id="found"></p><div id="list"></div></aside><main id="detail"></main></div>
<script src="gallery-data.js"></script><script src="review-gt.private.js"></script><script>
const D=window.DATASET,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected,question,angle='isometric';const label={short:'短',medium:'中',long:'长'};
const C=D.release.counts;$('#stats').innerHTML=[['社区来源记录',C.sourceModels],['可运行模型',C.runnableModels],['动态题',C.dynamicQuestions],['静态题',C.staticQuestions]].map(([s,n])=>`<div><strong>${n}</strong> ${s}</div>`).join('');
const categoryNames={'house-building':'建筑','furniture-object':'家具和生活物件','road-vehicle':'车辆','aircraft':'飞机和直升机','spacecraft':'太空模型','boat':'船','railway':'火车和轨道','robot-machine':'机器人和机械','animal':'动物','plant-food':'植物和食物','other':'其他'};[...new Set(D.models.map(m=>m.category))].sort().forEach(c=>$('#category').add(new Option(categoryNames[c]||c,c)));
function filter(){let s=$('#search').value.toLowerCase(),l=$('#level').value,c=$('#category').value;let rows=D.models.filter(m=>(m.title+' '+m.setNumber).toLowerCase().includes(s)&&(!l||m.difficulty===l)&&(!c||m.category===c));$('#found').textContent=`显示 ${rows.length} 个可运行模型`;
$('#list').innerHTML=rows.map(m=>`<button class="model ${selected?.id===m.id?'active':''}" data-id="${esc(m.id)}">${esc(m.title)}<span>${esc(m.setNumber)} · ${m.activeParts} 件 · 动态 ${m.dynamicCases} / 静态 ${m.staticCases}</span></button>`).join('');$('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b.dataset.id));}
function choose(id){selected=D.models.find(m=>m.id===id);question=D.questions.find(q=>q.model===id&&q.mode==='static')||D.questions.find(q=>q.model===id&&q.taskType==='D0');angle='isometric';filter();show();history.replaceState(null,'','#'+encodeURIComponent(id));}
function show(){const m=selected,q=question,qs=D.questions.filter(x=>x.model===m.id),base=m.preview.slice(0,-'overview.png'.length);let current,target,caption;
if(q.mode==='static'){current=`static-current-${angle}.png`;target=`static-target-${angle}.png`;caption='静态题：检查当前状态；有错则修复，正确则直接结束。'}
else if(q.family==='control'){current=`initial-${angle}.png`;target=`target-${angle}.png`;caption='正常动态题：从左图开始，模型自主观察并逐件完成右图。'}
else{current=`${q.assetFamily||q.family}-event-1-after.png`;target=`${q.assetFamily||q.family}-event-1-before.png`;caption='动态题的参考事件：前两张说明发生了什么变化；最终仍要拼成第三张的验收目标。实际运行从初始状态开始，事件按真实进度触发。'}
$('#detail').innerHTML=`<section class="panel context"><img src="${base}overview.png" alt="完整物件与本题范围"><div><h2>${esc(m.title)}</h2><p><span class="tag">${m.scope.kind==='complete-object'?'完整拼装':'收尾模块'}</span><span class="tag">${label[m.difficulty]}过程 · ${m.activeParts} 件</span><span class="tag">真人待检查</span></p><p>${esc(m.scopeDescriptionZh||m.scope.description)}</p><p class="muted">原物件共 ${m.sourceParts} 件。上方全景用于认物件，青色轮廓标出操作范围。做题以本题验收目标为准；${m.scope.kind==='complete-object'?'从空底板开始拼装。':'其余主体已经拼好。'}${m.sourceUrl?`<a href="${esc(m.sourceUrl)}" target="_blank" rel="noopener">原始来源</a>`:"本项目设计的完整物件。"}</p></div></section>
<section class="panel"><h3>${esc(q.familyZh)} · ${q.mode==='static'?'静态':'动态'}</h3><p>${caption}</p>${q.mode==='static'||q.family==='control'?'<div class="views">'+[['isometric','斜前方'],['rear','后方'],['top','上方']].map(([v,n])=>`<button data-view="${v}" class="${v===angle?'active':''}">${n}</button>`).join('')+'</div>':''}<div class="pair" style="${q.mode==='dynamic'&&q.family!=='control'?'grid-template-columns:repeat(3,1fr)':''}"><figure><figcaption>${q.mode==='dynamic'&&q.family!=='control'?'干扰后的参考状态':'当前／初始状态'}</figcaption><img src="${base+current}" alt="当前状态"></figure><figure><figcaption>${q.mode==='dynamic'&&q.family!=='control'?'本次事件之前（参考）':'本题验收目标'}</figcaption><img src="${base+target}" alt="目标或事件前状态"></figure>${q.mode==='dynamic'&&q.family!=='control'?`<figure><figcaption>本题最终验收目标</figcaption><img src="${base}target-isometric.png" alt="最终验收目标"></figure>`:''}</div><p class="muted">每次只装或拆一块；可以随时观察、转动视角、查看说明和库存。允许其他合法拼装顺序；最后状态正确即可。参考动作不是最短步数保证。</p><details><summary>查看本题输入输出、GT 文件位置</summary><pre>${esc(JSON.stringify({question:q,gt:window.REVIEW_GT?.[q.id]},null,2))}</pre></details></section>
<section class="panel"><h3>这个模型的全部题目</h3><table><thead><tr><th>类型</th><th>错误／任务</th><th>参考动作数</th><th>事件数</th><th>题目 ID</th></tr></thead><tbody>${qs.map(x=>`<tr data-question="${esc(x.id)}" class="${x.id===q.id?'selected':''}"><td>${x.mode==='static'?'静态':'动态'}</td><td>${esc(x.familyZh)}</td><td>${x.referenceMoves}</td><td>${x.scheduledEvents}</td><td><code>${esc(x.id)}</code></td></tr>`).join('')}</tbody></table><p class="muted">动态修复先跑同题无干扰分支；未拼成功的不进入主修复比较。事件未发生时记为“未触发”，接口失败单独统计。</p></section>`;
$('#detail').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{angle=b.dataset.view;show()});$('#detail').querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{question=qs.find(x=>x.id===b.dataset.question);show()});}
for(const k of ['search','level','category'])$('#'+k).addEventListener(k==='search'?'input':'change',filter);filter();let initial=decodeURIComponent(location.hash.slice(1));if(D.models.length)choose(D.models.some(m=>m.id===initial)?initial:D.models[0].id);
</script></html>
