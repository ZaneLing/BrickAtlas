name: Verify Brick Atlas
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run assets:build
      - run: git diff --exit-code -- public/models assets-built assets-source/library-lock.json
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/
            assets-built/*report.json
