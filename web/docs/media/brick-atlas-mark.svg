      <rect x="0" y="38" width="72" height="8" rx="2" fill="#a92420"/>
      <circle cx="17" cy="8" r="8" fill="#ff776f"/>
      <circle cx="52" cy="8" r="8" fill="#ff776f"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="34 -22;0 0;0 0;34 -22" keyTimes="0;.24;.78;1" dur="4s" repeatCount="indefinite"/>
      <rect x="78" y="8" width="72" height="38" rx="5" fill="#f0c431"/>
      <rect x="78" y="38" width="72" height="8" rx="2" fill="#b58a12"/>
      <circle cx="95" cy="8" r="8" fill="#ffe36d"/>
      <circle cx="130" cy="8" r="8" fill="#ffe36d"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-34 24;0 0;0 0;-34 24" keyTimes="0;.3;.78;1" dur="4s" repeatCount="indefinite"/>
      <rect x="0" y="57" width="72" height="38" rx="5" fill="#356fce"/>
      <rect x="0" y="87" width="72" height="8" rx="2" fill="#20478a"/>
      <circle cx="17" cy="57" r="8" fill="#78a5ee"/>
      <circle cx="52" cy="57" r="8" fill="#78a5ee"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="34 24;0 0;0 0;34 24" keyTimes="0;.36;.78;1" dur="4s" repeatCount="indefinite"/>
      <rect x="78" y="57" width="72" height="38" rx="5" fill="#20a3b4"/>
      <rect x="78" y="87" width="72" height="8" rx="2" fill="#126b78"/>
      <circle cx="95" cy="57" r="8" fill="#6bcbd5"/>
      <circle cx="130" cy="57" r="8" fill="#6bcbd5"/>
