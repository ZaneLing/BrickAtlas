<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title description">
  <title id="title">Brick Atlas</title>
  <desc id="description">Four colorful building bricks assemble into the Brick Atlas mark.</desc>
  <rect width="1000" height="240" rx="8" fill="#f7f8fb"/>
  <g transform="translate(250 58)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-34 -22;0 0;0 0;-34 -22" keyTimes="0;.18;.78;1" dur="4s" repeatCount="indefinite"/>
