  <text x="446" y="148" fill="#68738a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="600">EXPLORE · BUILD · CREATE</text>
  <g transform="translate(250 190)">
    <rect width="100" height="5" fill="#e23b34"/>
    <rect x="100" width="100" height="5" fill="#f0c431"/>
    <rect x="200" width="100" height="5" fill="#356fce"/>
    <rect x="300" width="100" height="5" fill="#20a3b4"/>
    <rect x="400" width="100" height="5" fill="#cf4f92"/>
